name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-sanitizers:
    name: Linux GCC · ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain versions
        run: |
          g++ --version
          cmake --version
          ninja --version
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DTINYCORO_ENABLE_SANITIZERS=ON
          -DTINYCORO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify installed CMake package
        run: |
          prefix="${{ runner.temp }}/tinycoro-install"
          cmake -S . -B package-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTINYCORO_BUILD_EXAMPLES=OFF \
            -DTINYCORO_BUILD_TESTS=OFF \
            -DTINYCORO_WARNINGS_AS_ERRORS=ON
          cmake --build package-build --parallel
          cmake --install package-build --prefix "$prefix"
          cmake -S tests/package_consumer -B package-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build package-consumer --parallel
          ./package-consumer/package_consumer

  linux-clang:
    name: Linux Clang · Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain versions
        run: |
          clang++ --version
          cmake --version
          ninja --version
      - name: Configure
        env:
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTINYCORO_WARNINGS_AS_ERRORS=ON
      - name: Build and test
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure
